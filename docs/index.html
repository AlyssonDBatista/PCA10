<style>
/* Caderno de estudo: uma coluna estreita como folha de caderno; serifa nos títulos, sans no corpo */
:root{
  --paper:#F7F3EA; --sheet:#FFFDF8; --ink:#22303F; --muted:#5A6573; --line:#D9D1C0; --tint:#EFE8DA;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --ok:#1F6F5C; --ok-bg:#E3F1EC; --no:#A63D2F; --no-bg:#F8E6E2; --warn:#8A5A12;
  --f-display:'Fraunces',Georgia,'Times New Roman',serif; --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#171C21; --sheet:#20262C; --ink:#ECE6D8; --muted:#A9B1B8; --line:#39424A; --tint:#2A3138;
  --accent:#62B79D; --accent-ink:#0F1A16; --ok:#6BC4A8; --ok-bg:#16332B; --no:#F09A8B; --no-bg:#3A221F; --warn:#E3B261; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171C21; --sheet:#20262C; --ink:#ECE6D8; --muted:#A9B1B8; --line:#39424A; --tint:#2A3138;
  --accent:#62B79D; --accent-ink:#0F1A16; --ok:#6BC4A8; --ok-bg:#16332B; --no:#F09A8B; --no-bg:#3A221F; --warn:#E3B261; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--f-body)}
main{max-width:640px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;line-height:1.2}
h1{font-weight:700;font-size:clamp(30px,7vw,38px);line-height:1.1}
h2{font-size:21px}
p{margin:0}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mut{color:var(--muted)}.small{font-size:14px}.tiny{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{min-height:52px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px;padding:0 18px}
.btn-line{min-height:46px;border:1.5px solid var(--accent);border-radius:10px;background:transparent;color:var(--accent);font-weight:600;font-size:15px;padding:0 14px}
.btn-quiet{min-height:44px;border:none;background:none;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:0 4px}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mod{min-height:72px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);font-weight:600;font-size:15px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.mod span{font-weight:400;font-size:14px;color:var(--muted)}
.mod.wide{grid-column:1/-1;min-height:52px;flex-direction:row;align-items:center}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.row:last-of-type{border-bottom:none;padding-bottom:0}
.row strong{white-space:nowrap;font-variant-numeric:tabular-nums}
.okt{color:var(--ok)}.not{color:var(--no)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.clock.low{color:var(--no)}
.track{height:6px;border-radius:3px;background:var(--tint)}
.track>div{height:6px;border-radius:3px;background:var(--accent)}
.tag{align-self:flex-start;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.qtext{font-family:var(--f-display);font-weight:500;font-size:clamp(20px,5vw,23px);line-height:1.35}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:54px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);font-size:16px;line-height:1.45}
.opt .dot{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:11px 13px;background:var(--tint)}
.opt[aria-pressed="true"] .dot{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav .btn{flex:1 1 200px}
.result{border-width:2px}
.result.pass{border-color:var(--ok)}.result.fail{border-color:var(--no)}
.score{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.mrow{display:flex;flex-direction:column;gap:4px;font-size:15px}
.mrow .lbl{display:flex;justify-content:space-between;gap:10px}
.mrow .lbl b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mbar{height:8px;border-radius:4px;background:var(--tint)}
.mbar>div{height:8px;border-radius:4px;background:var(--accent)}
.mbar>div.zero{background:var(--no)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);padding:0 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rv{gap:10px}
.rv .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pill{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.no{background:var(--no-bg);color:var(--no)}.pill.bl{background:var(--tint);color:var(--muted)}
.ro{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.ro.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.ro.no{background:var(--no-bg);border-color:var(--no);color:var(--no);font-weight:600}
.ro small{display:block;font-size:13px;font-weight:700;margin-top:2px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.warnbox{font-size:14px;line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.warnbox b{color:var(--warn)}
@media (max-width:360px){.mods{grid-template-columns:1fr}}
.qtext:focus{outline:none}
.resume{border-color:var(--accent)}
.resume .row{border:none;padding:0}
.kbd{font-size:13px;color:var(--muted)}
@media (hover:none),(pointer:coarse){.keys{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  :root{--paper:#fff;--sheet:#fff;--ink:#000;--muted:#333;--line:#bbb}
  body{background:#fff;font-size:12pt}
  main{max-width:none;padding:0}
  button,.nav,.filters,.kbd{display:none!important}
  .sheet{break-inside:avoid;border-color:#bbb}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const M=["Objetivos e Legislação","Funcionamento e Processos","Cálculos Financeiros","Ética e Melhores Práticas"];
const W=[24,26,25,25],N=[15,20,10,5];
/* [módulo, enunciado, [correta, errada, errada, errada], explicação, fonte]. A tela embaralha as alternativas. */
const Q=[
[0,"Pela Circular 3.978, a comunicação ao Coaf de operação suspeita deve ser feita:",["Sem dar ciência aos envolvidos nem a terceiros","Com ciência prévia ao cliente, por escrito","Após autorização formal do cliente envolvido","Com cópia ao cliente e ao seu procurador"],"Art. 50.","Circular BCB 3.978/2020, art. 50"],
[0,"Cliente fraciona depósitos em espécie para ficar abaixo do valor de comunicação. Isso é:",["Indício de operação suspeita, que deve ser analisado e, se for o caso, comunicado","Prática legítima de gestão de caixa, que dispensa análise ou registro","Motivo para avisar o cliente de que ele será comunicado ao Coaf","Irrelevante para PLD, pois cada depósito isolado fica abaixo do limite de comunicação"],"Fracionar valores para fugir de controles é sinal clássico de lavagem de dinheiro.","Circular BCB 3.978/2020, arts. 39 e ss. (indício de operação suspeita)"],
[0,"O monitoramento de operações suspeitas deve se basear em:",["Regras e parâmetros da política interna de PLD, considerando o perfil de risco do cliente","Nas denúncias recebidas de terceiros, sem nenhuma regra ou parâmetro interno próprio","No valor das prestações, independentemente do perfil do cliente","Em amostras aleatórias de operações, sem considerar o risco do cliente"],"Circular BCB 3.978, arts. 39 e seguintes.","Circular BCB 3.978/2020, arts. 39 e ss."],
[0,"Segundo o art. 10 da Lei 9.613/1998, as pessoas obrigadas devem:",["Identificar clientes e manter cadastro, registrar transações e atender às requisições do Coaf","Identificar clientes só em operações acima de R$ 50 mil e descartar os registros após um ano","Manter cadastro só de pessoas jurídicas e responder ao Coaf quando o cliente autorizar","Registrar as transações em espécie e avisar o cliente antes de atender ao Coaf"],"Lei 9.613/1998, art. 10.","Lei 9.613/1998, art. 10"],
[0,"Que tipo de pessoa jurídica pode ser administradora de consórcio?",["Sociedade limitada ou sociedade anônima, autorizada pelo Banco Central","Fundação privada, autorizada pelo Ministério da Fazenda","Cooperativa de crédito, autorizada pela Comissão de Valores Mobiliários","Empresário individual, registrado na Junta Comercial e no Procon"],"Art. 5º da Lei 11.795/2008; o funcionamento depende de autorização do Banco Central (art. 7º).","Lei 11.795/2008, art. 5º"],
[0,"Na avaliação de viabilidade do grupo, a administradora deve considerar:",["A contemplação de todos no prazo, a capacidade de pagamento e a inadimplência e exclusões esperadas","O lucro esperado da administradora, o número de vendedores e o preço médio dos bens","A contemplação de todos já no primeiro ano, a renda média da região e os juros de mercado do período","O preço do bem e o número de cotas vendidas, sem considerar inadimplência"],"Art. 3º da Res. BCB 285.","Res. BCB 285/2023, art. 3º"],
[1,"Após a última assembleia de contemplação, em quanto tempo a administradora deve comunicar aos consorciados os créditos e saldos que estão à disposição?",["60 dias","10 dias","30 dias","180 dias"],"Art. 31 da Lei 11.795/2008. O encerramento ocorre em até 120 dias da última assembleia de contemplação, decorridos ao menos 30 dias dessa comunicação (art. 32).","Lei 11.795/2008, arts. 31 e 32"],
[1,"Pela Lei 11.795/2008, a pretensão do consorciado ou do excluído contra o grupo ou a administradora, e destes contra aqueles, prescreve em:",["Cinco anos","Um ano","Dez anos","Três anos"],"Art. 32, §2º: prazo de cinco anos, contado na forma do caput do art. 32, que trata do encerramento do grupo.","Lei 11.795/2008, art. 32, §2º"],
[2,"Crédito de R$ 100.000, 80 meses, taxa de administração de 16% e fundo de reserva de 3%, sem seguro. Qual a prestação?",["R$ 1.487,50","R$ 1.450,00","R$ 1.500,00","R$ 1.460,00"],"Fundo comum 1.250; taxa 16.000÷80 = 200; reserva 3.000÷80 = 37,50. Total: 1.487,50.","Lei 11.795/2008, art. 27; Res. BCB 285/2023, arts. 19 e 22 (cálculo)"],
[2,"Crédito de R$ 48.000, 48 meses, taxa de administração de 15%, sem fundo de reserva. Qual a prestação?",["R$ 1.150,00","R$ 1.100,00","R$ 1.200,00","R$ 1.015,00"],"Fundo comum 1.000; taxa 7.200÷48 = 150. Total: 1.150.","Lei 11.795/2008, art. 27; Res. BCB 285/2023, arts. 19 e 22 (cálculo)"],
[2,"Lance de 35% sobre crédito de R$ 60.000. Qual o valor do lance?",["R$ 21.000","R$ 2.100","R$ 35.000","R$ 12.000"],"35% × 60.000 = 21.000.","Res. BCB 285/2023, arts. 12 e 13 (cálculo)"],
[2,"Lance de 30% sobre crédito de R$ 70.000, com 10% do crédito embutido. Quanto é pago com recursos próprios?",["R$ 14.000","R$ 21.000","R$ 7.000","R$ 63.000"],"Lance 21.000; embutido 10% × 70.000 = 7.000; próprios 21.000 − 7.000 = 14.000.","Res. BCB 285/2023, arts. 12 e 13 (cálculo)"],
[2,"Excluído pagou 40 de 100 parcelas de fundo comum. O crédito atualizado é R$ 90.000. Qual o valor amortizado?",["R$ 36.000","R$ 40.000","R$ 54.000","R$ 90.000"],"40 ÷ 100 = 40%; 40% × 90.000 = 36.000.","Res. BCB 285/2023, arts. 32-A e 33 (cálculo)"],
[2,"Grupo de 90 cotas com 3 contemplações por mês. Em quantos meses todos serão contemplados?",["30 meses","27 meses","45 meses","90 meses"],"90 ÷ 3 = 30.","Res. BCB 285/2023, art. 3º, §1º (cálculo)"],
[2,"Taxa de administração total de 22% sobre crédito de R$ 30.000. Qual o valor total da taxa?",["R$ 6.600","R$ 660","R$ 3.000","R$ 22.000"],"22% × 30.000 = 6.600.","Lei 11.795/2008, art. 27; Res. BCB 285/2023, arts. 19 e 22 (cálculo)"],
[2,"Fundo de reserva de 2% sobre crédito de R$ 90.000 em 60 meses. Qual a parcela mensal do fundo de reserva?",["R$ 30","R$ 18","R$ 36","R$ 1.800"],"2% × 90.000 = 1.800; ÷ 60 = 30.","Lei 11.795/2008, art. 27; Res. BCB 285/2023, arts. 19 e 22 (cálculo)"],
[3,"Cliente pergunta se pode desistir depois de contratar. O profissional deve:",["Explicar as regras de saída do contrato e da lei, inclusive o arrependimento quando aplicável","Dizer que não é possível desistir depois de assinado, para evitar cancelamentos","Prometer a devolução integral e imediata de tudo o que foi pago, em qualquer caso","Orientar que basta parar de pagar, pois sair por inadimplência não tem nenhuma consequência para ele"],"CDC, art. 49: 7 dias quando a contratação é fora do estabelecimento; demais regras estão no contrato.","CDC (Lei 8.078/1990), art. 49"],
[3,"É comportamento ético do profissional de consórcio:",["Deixar de vender quando percebe que o produto não atende à necessidade do cliente","Oferecer o plano que paga a maior comissão, desde que o cliente assine o contrato","Omitir custos que o cliente não perguntou, para não complicar a explicação","Pressionar o cliente a decidir no mesmo dia, para garantir a vaga no grupo"],"Boas práticas do Sistema de Consórcios: o interesse e a informação do cliente vêm antes da meta.","Boas práticas e Código de Conduta (sem artigo)"],
[3,"Ao receber comissão extra para empurrar um plano inadequado, o profissional deve:",["Priorizar o interesse do cliente e recusar a prática","Aceitar, desde que a meta mensal seja atingida","Oferecer o plano, sem contar ao cliente o motivo","Aceitar e dividir a comissão extra com o cliente"],"Venda inadequada gera inadimplência, exclusão e responsabilização.","Boas práticas e Código de Conduta (sem artigo)"],
[3,"Vender consórcio como se fosse investimento com rendimento garantido é:",["Prática enganosa, pois consórcio é compra planejada sem rentabilidade garantida","Permitido, desde que o cliente assine um termo aceitando a rentabilidade informada","Recomendado, pois o consórcio é aplicação financeira regulada pelo Banco Central","Lícito, porque o valor pago é devolvido com rendimento no encerramento do grupo"],"CDC, art. 37: o consórcio não é aplicação financeira.","CDC (Lei 8.078/1990), art. 37"],
[3,"Antes de fechar a venda, o profissional deve conferir:",["Se o cliente leu e compreendeu o contrato, as taxas, o prazo e as regras de contemplação","O CPF e a renda do cliente, pois as regras do contrato são explicadas depois","Se o cliente assinou rapidamente, para não perder a vaga na próxima assembleia","O valor da primeira parcela, que é o que mais interessa ao cliente no momento da adesão"],"Informação clara e compreensão do contrato evitam a venda inadequada.","Boas práticas e Código de Conduta (sem artigo)"],
[3,"Ao tirar dúvidas do cliente por mensagem, o profissional deve:",["Usar informações verdadeiras e registrar a orientação dada quando relevante","Prometer contemplação rápida para manter o cliente interessado na conversa","Usar exemplos com dados reais de outros clientes, para facilitar o entendimento","Responder só por áudio, sem registro, para agilizar o atendimento ao cliente"],"Informação correta e clara ao consumidor (CDC, arts. 6º, III e 31) e tratamento de dados com finalidade e segurança (LGPD, art. 6º).","CDC, arts. 6º, III e 31; LGPD, art. 6º"],
[0,"Os recursos do grupo de consórcio devem ser contabilizados:",["De forma separada dos recursos da administradora e dos demais grupos","Junto com os recursos da administradora, em conta de uso comum","Em uma única conta para todos os grupos da mesma administradora","Pela seguradora do grupo, que responde pelos recursos arrecadados"],"Art. 3º, §4º da Lei 11.795/2008: os recursos dos grupos são contabilizados separadamente. O §3º completa: o grupo tem patrimônio próprio, que não se confunde com o de outro grupo nem com o da administradora.","Lei 11.795/2008, art. 3º, §§3º e 4º"],
[0,"Segundo a Res. BCB 285, o consorciado contemplado que ainda não usou o crédito e é excluído do grupo:",["Mantém a contemplação, com direito ao crédito parcial","Perde a contemplação e volta a concorrer só a sorteio","Mantém a contemplação, com direito ao crédito integral","Perde a contemplação e recebe o pago no fim do grupo"],"Art. 33. O crédito parcial só é disponibilizado com a contemplação (art. 11). Atenção: pela Circular 3.432 (referência do edital de 2023, ainda válida para grupos anteriores a 1º/7/2024), o contemplado não podia ser excluído.","Res. BCB 285/2023, art. 33"],
[0,"Segundo a Res. BCB 285, o consorciado pode ser excluído do grupo:",["Por manifestação própria, por três vencimentos sem pagar ou por até dois vencimentos em atraso na última assembleia ordinária","Por manifestação própria, por seis vencimentos sem pagar ou por decisão da administradora, a qualquer tempo e sem aviso","Por ordem judicial, após três vencimentos sem pagar e notificação em cartório","Por decisão da assembleia, por dois vencimentos consecutivos sem pagar ou por mudança de endereço"],"Art. 32, I a III. O número fixo de três vencimentos é novidade da Res. 285; pela Circular 3.432 (grupos anteriores a 1º/7/2024), a exclusão por inadimplência seguia as regras do contrato.","Res. BCB 285/2023, art. 32, I a III"],
[1,"O fundo de reserva, quando constituído, pode ser usado para:",["Cobrir insuficiência do fundo comum, seguro de inadimplência, despesas de cobrança e contemplações adicionais","Pagar comissões de vendedores, despesas de publicidade dos grupos e a antecipação da taxa de administração cobrada","Remunerar a administradora, pagar tributos da empresa e cobrir despesas do escritório","Pagar as despesas bancárias de gerenciamento e a auditoria independente do grupo"],"Art. 22 da Res. BCB 285: uso restrito às finalidades previstas.","Res. BCB 285/2023, art. 22"],
[1,"Recursos devidos a consorciado e não procurados devem ser pagos pela administradora em até:",["30 dias corridos do comparecimento do consorciado com direito","5 dias úteis do encerramento do grupo, sem necessidade de pedido","60 dias corridos do pedido, após a aprovação em assembleia","120 dias da última assembleia, junto com a prestação de contas"],"Art. 36 da Lei 11.795/2008.","Lei 11.795/2008, art. 36"],
[1,"O rateio entre consorciados ativos para cobrir insuficiência de recursos do grupo (art. 25-B):",["É cobrança extraordinária e não amortiza o crédito","É cobrança ordinária e amortiza o percentual do bem","É devolvido ao contemplado no encerramento do grupo","É opcional e só cobrado de quem já foi contemplado"],"Art. 25-B, §4º da Res. BCB 285.","Res. BCB 285/2023, art. 25-B, §4º"],
[1,"A assembleia geral ordinária (AGO) é aquela em que:",["São apreciadas as contas do grupo e realizadas as contemplações","Se decidem a substituição da administradora e a fusão de grupos","Só se vota quando 30% dos consorciados ativos fazem o pedido","Se tratam do encerramento antecipado e da dissolução do grupo"],"Art. 18 da Lei 11.795/2008. A assembleia extraordinária (art. 19) trata dos demais assuntos e é convocada pela administradora, por iniciativa própria ou a pedido de 30% dos consorciados ativos.","Lei 11.795/2008, arts. 18 e 19"],
[1,"Na assembleia geral, a regra de votação é:",["Um voto por cota ativa, com decisão por maioria simples","Um voto por consorciado, mesmo que ele tenha várias cotas","Voto proporcional ao valor já pago, por maioria absoluta","Um voto por contemplado, com decisão por maioria de dois terços"],"Art. 20 da Lei 11.795/2008: cada cota de consorciado ativo vale um voto, e as deliberações são por maioria simples. A Res. BCB 285 (art. 44, §§2º e 3º) limita o voto aos adimplentes e conta a maioria pelos votos dos presentes, sem os brancos.","Lei 11.795/2008, art. 20 (e Res. BCB 285, art. 44)"],
[2,"Crédito de R$ 150.000, 120 meses, taxa de administração de 24% e fundo de reserva de 3%, sem seguro. Qual a prestação?",["R$ 1.587,50","R$ 1.550,00","R$ 1.600,00","R$ 1.650,00"],"Fundo comum 1.250; taxa 36.000÷120 = 300; reserva 4.500÷120 = 37,50. Total: 1.587,50.","Lei 11.795/2008, art. 27; Res. BCB 285/2023, arts. 19 e 22 (cálculo)"],
[2,"Lance de R$ 50.000, sendo 40% embutido. Quanto é pago com recursos próprios?",["R$ 30.000","R$ 20.000","R$ 40.000","R$ 10.000"],"Embutido 40% × 50.000 = 20.000; próprios 50.000 − 20.000 = 30.000.","Res. BCB 285/2023, arts. 12 e 13 (cálculo)"],

[2,"Excluído pagou 18 parcelas de fundo comum em plano de 72 meses. O crédito atualizado é R$ 60.000. Qual o crédito parcial?",["R$ 15.000","R$ 18.000","R$ 12.000","R$ 45.000"],"Percentual amortizado = 18 ÷ 72 = 25%; 25% × 60.000 = 15.000.","Res. BCB 285/2023, arts. 32-A e 33 (cálculo)"],
[2,"Consorciado excluído pagou 18 de 72 parcelas de fundo comum. O crédito atualizado é R$ 60.000 e o contrato prevê multa rescisória de 15% sobre o crédito parcial. Sem outras pendências, quanto ele recebe na contemplação?",["R$ 12.750","R$ 15.000","R$ 13.500","R$ 2.250"],"Percentual amortizado: 18 ÷ 72 = 25%; crédito parcial: 25% × 60.000 = 15.000. Multa: 15% × 15.000 = 2.250. Recebe 15.000 − 2.250 = 12.750.","Res. BCB 285/2023, arts. 32-A e 33 (cálculo)"],
[2,"Seguro de 0,04% ao mês sobre crédito de R$ 75.000. Qual o valor mensal do seguro?",["R$ 30","R$ 3","R$ 300","R$ 40"],"0,04% × 75.000 = 30.","Lei 11.795/2008, art. 27; Res. BCB 285/2023, arts. 19 e 22 (cálculo)"],
[3,"Cliente com pouca instrução financeira não entende a taxa de administração. O profissional deve:",["Explicar com linguagem simples e exemplos, e confirmar o entendimento antes da adesão","Dizer que a taxa não é importante, pois ela já está incluída no valor de cada prestação mensal","Pedir que ele leia o contrato sozinho, sem explicações, e assine se concordar","Apressar o fechamento e deixar a explicação para depois da primeira assembleia"],"Informação clara e adequada é direito básico do consumidor (CDC, art. 6º, III).","CDC (Lei 8.078/1990), art. 6º, III"],
[3,"Ao indicar um plano, o critério principal do profissional deve ser:",["A necessidade e a capacidade de pagamento do cliente","A maior comissão e a meta de vendas do mês","O plano mais longo, que tem a menor parcela mensal","O grupo com o maior número de cotas à venda"],"Venda inadequada leva à inadimplência, exclusão e responsabilização.","Boas práticas e Código de Conduta (sem artigo)"],
[3,"Dados pessoais e financeiros do cliente devem ser tratados:",["Com sigilo, usando só os dados necessários e apenas para a finalidade da contratação","Compartilhados livremente com parceiros comerciais, pois o cliente já assinou o contrato","Guardados sem restrição de uso, para futuras ofertas de quaisquer produtos de terceiros","Divulgados à equipe de vendas e a correspondentes, para agilizar novas ofertas"],"Lei 13.709/2018 (LGPD), art. 6º: finalidade (I), necessidade (III) e segurança (VII), entre outros princípios do tratamento de dados.","LGPD (Lei 13.709/2018), art. 6º, I, III e VII"],
[3,"Divulgar que o consórcio não tem custo, sem informar a taxa de administração, pode ser:",["Publicidade enganosa por omissão","Publicidade abusiva por comparação","Prática correta, pois a taxa está no contrato","Cortesia comercial permitida pelo CDC"],"CDC, art. 37: o consórcio tem taxa de administração e outros custos que devem ser informados.","CDC (Lei 8.078/1990), art. 37"],
[3,"Cliente reclama que não foi contemplado. A atitude adequada é:",["Registrar a reclamação, explicar como funcionam sorteio e lance e indicar os canais de atendimento","Prometer que ele será contemplado já na próxima assembleia, para evitar o cancelamento do contrato","Explicar que a contemplação segue a antiguidade no grupo e pedir que aguarde a vez","Sugerir que ele pare de pagar até ser contemplado, para pressionar a administradora"],"Boas práticas: transparência e respeito ao consumidor, sem promessas que a lei não permite.","Boas práticas e Código de Conduta (sem artigo)"],
[3,"Ao identificar que o cliente é pessoa exposta politicamente (PEP), a administradora deve:",["Aplicar diligência reforçada da política de PLD, sem que a condição de PEP impeça a contratação","Recusar o cliente automaticamente, pois a Circular proíbe relação de negócios com PEP","Comunicar ao Coaf todas as operações do cliente, independentemente de análise prévia","Tratar o cliente como qualquer outro, pois a condição de PEP só vale enquanto durar o seu mandato eletivo"],"Circular BCB 3.978, art. 27: as instituições devem qualificar clientes como PEP. Segundo o BCB (23/01/2020), a condição eleva o nível do conheça seu cliente, mas não significa que todas as operações serão comunicadas ao Coaf.","Circular BCB 3.978/2020, art. 27 (e comunicado do BCB de 23/01/2020)"],

[0,"Para grupos constituídos antes da vigência da Res. BCB 285, a regra de transição é:",["Seguem as regras anteriores até o encerramento, salvo alguns artigos (como assembleias, demonstrativo e FGTS)","Passam a seguir toda a Res. BCB 285 desde 1º/7/2024, sem nenhuma exceção e sem qualquer regra de transição prevista","Devem ser encerrados até 1º/7/2024, com os consorciados transferidos para grupos novos","Precisam refazer todos os contratos de adesão em até 90 dias, com nova assinatura"],"Arts. 56 e 57: exceção para os arts. 14, 25-A, 25-B, 36, 44, 49, 51 e 53 a 55.","Res. BCB 285/2023, arts. 56 e 57"],

[0,"Pela Resolução BCB 285 (grupos constituídos desde 1º/7/2024), é vedada a exclusão do consorciado contemplado que:",["Já utilizou o crédito para adquirir o bem ou serviço","Ainda não escolheu o bem","Manifestou intenção de sair","Está há três vencimentos sem pagar e não usou o crédito"],"Art. 32, parágrafo único (Res. BCB 362/2023): só fica vedada a exclusão de quem já usou o crédito. Quem foi contemplado e ainda não usou pode ser excluído e mantém a contemplação, com crédito parcial (art. 33). Atenção: grupos anteriores a 1º/7/2024 seguem a Circular 3.432, que vedava a exclusão de qualquer contemplado.","Res. BCB 285/2023, art. 32, parágrafo único e art. 33 (grupos anteriores a 1º/7/2024: Circular 3.432)"],

[0,"O edital PCA-10 (v3.1, 2023) cita como referência a Circular BCB 3.432/2009. Desde 1º/7/2024, essa Circular está:",["Revogada pela Res. BCB 285, mas ainda regendo os grupos constituídos antes dessa data, salvo exceções","Em vigor para todos os grupos, pois o edital da certificação ainda a cita","Substituída pela Lei 11.795/2008, que passou a tratar de todos os detalhes","Revogada para todos os grupos, inclusive os constituídos antes de 1º/7/2024, que tiveram de se adaptar à nova norma"],"Res. BCB 285, art. 58, IV (revogação) e art. 57 (transição): grupos anteriores seguem as regras antigas até o encerramento, exceto os arts. 14, 25-A, 25-B, 36, 44, 49, 51 e 53 a 55.","Res. BCB 285/2023, arts. 57 e 58, IV"],
[0,"Pela Circular 3.432 (grupos anteriores a 1º/7/2024), o regulamento do grupo de consórcio devia ser:",["Registrado em cartório de títulos e documentos da localidade da sede da administradora","Aprovado previamente pela CVM e arquivado na sede da administradora","Publicado no Diário Oficial da União antes da primeira assembleia","Registrado na Junta Comercial do estado onde o grupo foi constituído, antes da primeira assembleia"],"Circular 3.432, art. 4º. A Res. BCB 285 eliminou essa exigência: o contrato padrão fica disponível no site da administradora (art. 2º, parágrafo único).","Circular BCB 3.432/2009 (revogada), art. 4º · lida por resumo do texto oficial do BCB"],
[0,"Pela Circular 3.432 (grupos anteriores a 1º/7/2024), o limite de 10% de cotas de um mesmo consorciado era calculado sobre:",["O número máximo de cotas ativas do grupo","As cotas ativas na data da venda, somadas às do cônjuge ou companheiro","O total de grupos da administradora","O valor do crédito"],"Circular 3.432, art. 7º, §4º. Na Res. BCB 285 (art. 9º), a base passou a ser as cotas ativas na data da venda, somando as do cônjuge ou companheiro.","Circular BCB 3.432/2009 (revogada), art. 7º, §4º · lida por resumo do texto oficial do BCB"],
[0,"Pela Circular 3.432 (grupos anteriores a 1º/7/2024), o crédito devia ser colocado à disposição do contemplado até o terceiro dia útil após:",["A contemplação","A homologação da contemplação","O encerramento do grupo","A entrega do bem"],"Circular 3.432, arts. 11 e 12. Na Res. BCB 285 (art. 16), o prazo conta da homologação da contemplação.","Circular BCB 3.432/2009 (revogada), arts. 11 e 12 · lida por resumo do texto oficial do BCB"],
[0,"Segundo a Res. BCB 285, a administradora de consórcio deve indicar um diretor responsável:",["Pela observância do disposto na Resolução","Pela escolha dos consorciados contemplados","Pela fixação do preço dos bens dos grupos","Pela auditoria do Banco Central nos grupos"],"Art. 55 da Res. BCB 285.","Res. BCB 285/2023, art. 55"],
[0,"Grupos de consórcio constituídos por associações e entidades civis sem fins lucrativos só podem ter como participantes:",["Integrantes efetivos do seu quadro social, na forma do estatuto","Qualquer pessoa física, desde que indicada por um associado","Pessoas jurídicas filiadas à entidade há mais de um ano","Clientes indicados pela administradora, sem vínculo com a entidade"],"Art. 50 da Res. BCB 285.","Res. BCB 285/2023, art. 50"],
[0,"Para a contagem dos prazos da regulamentação de consórcio, são considerados dias não úteis:",["Sábados, domingos, feriados nacionais e feriados estaduais e municipais da localidade do grupo","Domingos e feriados nacionais, pois o sábado conta como dia útil para os prazos de consórcio","Somente feriados nacionais, sem considerar os estaduais e municipais","Nenhum: todos os prazos da regulamentação são contados em dias corridos"],"Art. 52 da Res. BCB 285.","Res. BCB 285/2023, art. 52"],
[0,"Em grupo de bens móveis, o objeto deve pertencer a uma só subcategoria. Uma delas, segundo a Res. BCB 285, reúne:",["Veículos automotores, aeronaves, embarcações e máquinas e equipamentos","Imóveis na planta, terrenos e unidades em construção","Serviços de educação, saúde, turismo e reformas","Bens usados de qualquer natureza, inclusive importados, desde que tenham nota fiscal"],"Art. 5º, §2º, I. A outra subcategoria é a de bens móveis novos não incluídos nessa lista (inciso II).","Res. BCB 285/2023, art. 5º, §2º"],
[1,"Falecimento de consorciado não contemplado com seguro vinculado ao grupo: se a indenização for igual ou maior que o saldo devedor, ela é considerada:",["Lance vencedor na primeira assembleia ordinária seguinte com recursos para contemplação","Restituição imediata aos herdeiros, sem passar por assembleia de contemplação do grupo nem por sorteio","Receita da administradora, para compensar a taxa de administração restante","Recurso do fundo de reserva, usado em contemplações adicionais por sorteio"],"Art. 14 da Res. BCB 285. Esse artigo vale também para grupos anteriores a 1º/7/2024 (art. 57).","Res. BCB 285/2023, art. 14"],
[1,"O crédito colocado à disposição do contemplado e ainda não utilizado:",["É acrescido dos rendimentos líquidos da aplicação, proporcionais ao período","Fica parado na conta do grupo, sem render nada, até a utilização pelo consorciado contemplado","Perde valor a cada mês, pela cobrança de taxa de permanência","Passa para o fundo de reserva após 30 dias sem utilização"],"Art. 17 da Res. BCB 285.","Res. BCB 285/2023, art. 17"],
[1,"Após a contemplação, o consorciado pagou um sinal com recursos próprios na compra do bem. Segundo a Res. BCB 285, ele pode:",["Receber esse valor em espécie ou por transferência, deduzindo-o do crédito","Perder o valor pago, que não pode ser compensado com o crédito","Pedir que o grupo pague o sinal em dobro ao vendedor do bem","Exigir que o vendedor devolva o sinal antes que a administradora libere o crédito"],"Art. 18, §1º da Res. BCB 285: o valor pago com recursos próprios pode ser recebido em espécie ou por transferência, deduzido do crédito.","Res. BCB 285/2023, art. 18, §1º"],
[1,"Além de adquirir o bem ou serviço, o contemplado pode usar os recursos do grupo para:",["Quitar totalmente financiamento próprio cujo objeto seja da mesma categoria do bem do consórcio","Investir em ações ou fundos, desde que o valor fique aplicado em nome do grupo até o fim do plano","Pagar dívidas de qualquer natureza, como cartão de crédito e empréstimo pessoal","Quitar financiamento de terceiros, de qualquer categoria de bem, sem anuência"],"Art. 15, II da Res. BCB 285, na forma do contrato.","Res. BCB 285/2023, art. 15, II"],
[1,"Se o contemplado que já usou o crédito atrasar mais de uma prestação, a administradora deve:",["Adotar de imediato os procedimentos legais para executar as garantias","Aguardar o encerramento do grupo para cobrar as parcelas em atraso","Excluí-lo do grupo e devolver o crédito parcial na contemplação","Cancelar a contemplação e devolver o bem ao vendedor original"],"Art. 27 da Res. BCB 285. Lembre: quem já usou o crédito não pode ser excluído (art. 32, parágrafo único).","Res. BCB 285/2023, art. 27"],
[1,"A diferença positiva entre o seguro recebido e o saldo devedor do consorciado deve ser:",["Entregue imediatamente ao beneficiário indicado pelo titular ou, na falta, aos sucessores","Incorporada ao fundo comum do grupo, para custear novas contemplações por sorteio e por lance","Retida pela administradora até o encerramento do grupo e depois rateada","Usada em contemplações adicionais e o restante devolvido aos herdeiros"],"Art. 29 da Res. BCB 285.","Res. BCB 285/2023, art. 29"],
[1,"Na substituição do bem aprovada em assembleia extraordinária (por descontinuidade de produção, por exemplo), as prestações dos consorciados não contemplados:",["São ajustadas com base no preço do novo bem na data da assembleia","Não mudam até o fim do grupo, mesmo com a troca do bem","São canceladas e o grupo é dissolvido automaticamente","Só mudam quando o preço do novo bem for alterado no futuro, na mesma proporção"],"Art. 30, II. As dos contemplados não mudam de imediato e acompanham as alterações de preço do novo bem (inciso I).","Res. BCB 285/2023, art. 30"],
[1,"Quem é admitido em grupo de consórcio já em andamento deve:",["Pagar integralmente as obrigações no prazo remanescente do grupo","Pagar só as prestações futuras, sem compensar as já vencidas","Aguardar a formação do próximo grupo para começar a pagar","Pagar a taxa de administração das parcelas já vencidas, sem o fundo comum"],"Art. 34 da Res. BCB 285.","Res. BCB 285/2023, art. 34"],
[1,"A readmissão de consorciado excluído não contemplado no mesmo grupo:",["É facultativa, com pedido expresso e análise prévia da capacidade de pagamento","É obrigatória a qualquer tempo, bastando o pedido do consorciado excluído","É proibida pela Res. BCB 285, e o excluído só pode entrar em outro grupo","Depende de autorização do Banco Central e de aprovação em assembleia"],"Art. 35. A readmissão também não pode ultrapassar o número máximo de cotas ativas do grupo (§1º, I).","Res. BCB 285/2023, art. 35"],
[1,"Entre a última assembleia de contemplação e o encerramento do grupo, é vedado:",["Transferir o grupo ou seus recursos a outra administradora, salvo intervenção ou liquidação","Pagar créditos a consorciados excluídos que ainda não foram contemplados","Comunicar aos consorciados os saldos que estão à disposição para saque","Divulgar no site da administradora o encerramento do grupo e os valores disponíveis para saque"],"Art. 42 da Res. BCB 285.","Res. BCB 285/2023, art. 42"],
[1,"Compete à assembleia geral extraordinária deliberar, entre outros assuntos, sobre:",["Substituição da administradora, fusão de grupos, dilação do prazo e dissolução do grupo","As contemplações mensais por sorteio e a apuração dos lances ofertados pelos consorciados ativos","A autorização de funcionamento da administradora pelo Banco Central","O preço de venda das cotas novas e a comissão dos vendedores do grupo"],"Art. 47 da Res. BCB 285. As contemplações acontecem nas assembleias ordinárias.","Res. BCB 285/2023, art. 47"],
[1,"Ao tomar conhecimento da descontinuidade de produção do bem objeto do contrato, a administradora deve convocar assembleia extraordinária em até:",["Cinco dias úteis","Trinta dias","Sessenta dias","Na próxima assembleia ordinária"],"Art. 47, §1º da Res. BCB 285.","Res. BCB 285/2023, art. 47, §1º"],
[1,"Pela Res. BCB 285 (art. 47, §3º), a convocação da assembleia geral extraordinária é enviada a todos os consorciados, por correspondência física ou eletrônica com controle de recebimento, com antecedência de até:",["Oito dias úteis da realização da assembleia","Cinco dias úteis da realização da assembleia","Trinta dias corridos da realização da assembleia","Quinze dias corridos da realização da assembleia"],"Art. 47, §3º: a convocação é enviada \"com até oito dias úteis de antecedência da sua realização\", com a pauta e as informações do art. 44, §1º. Pelo §4º, nessa contagem entra o dia da assembleia e não entra o dia do envio da correspondência. Não confunda com os cinco dias úteis que a administradora tem para convocar a AGE depois do pedido de 30% dos consorciados (§2º).","Res. BCB 285/2023, art. 47, §§3º e 4º"],
[1,"Os valores não procurados que permanecem após o encerramento do grupo devem ser:",["Registrados individualmente, divulgados no site da administradora e informados ao Banco Central","Incorporados ao patrimônio da administradora na data do encerramento do grupo, como receita de serviço","Transferidos a outros grupos em andamento, para novas contemplações","Repassados a uma instituição de fora do Sistema de Consórcios, para gestão"],"Art. 39 da Res. BCB 285. É vedado transferir a gestão desses recursos a instituição de fora do Sistema de Consórcios (art. 43).","Res. BCB 285/2023, arts. 39 e 43"],
[1,"O contrato padrão de participação em grupo de consórcio deve ficar disponível:",["No site da administradora, com o histórico de alterações, até o encerramento do grupo","Registrado em cartório de títulos e documentos da sede da administradora","Na sede do Banco Central, para consulta mediante pedido formal","Somente para quem pedir por escrito, em até 30 dias após a solicitação"],"Art. 2º, parágrafo único, I. Ele também fica à disposição do Banco Central por no mínimo cinco anos após o encerramento (inciso II).","Res. BCB 285/2023, art. 2º, parágrafo único"],
[1,"Nas assembleias gerais ordinárias, a administradora deve:",["Disponibilizar as demonstrações financeiras do grupo e da administradora e prestar informações","Sortear as cotas, deixando as contas do grupo para a assembleia de encerramento","Cobrar taxa de participação de quem comparecer, para cobrir os custos","Votar no lugar dos ausentes, mesmo sem procuração ou previsão no contrato"],"Art. 45 da Res. BCB 285.","Res. BCB 285/2023, art. 45"],
[1,"A multa rescisória prevista em contrato para o consorciado excluído deve ser cobrada:",["Por ocasião da contemplação do excluído","No dia da exclusão, à vista","Em parcelas mensais até o fim do grupo","Após o encerramento do grupo"],"Art. 32-A, IV da Res. BCB 285.","Res. BCB 285/2023, art. 32-A, IV"],
[2,"Grupo de 60 meses, crédito de R$ 60.000. Um consorciado entra quando restam 40 meses. Sem reajuste, qual a parcela mensal de fundo comum dele?",["R$ 1.500","R$ 1.000","R$ 1.200","R$ 2.000"],"Quem entra em grupo em andamento paga tudo no prazo remanescente (art. 34): 60.000 ÷ 40 = 1.500.","Res. BCB 285/2023, art. 34 (cálculo)"],
[2,"Ao excluído, faltariam pagar R$ 3.000 de taxa de administração até o fim do grupo. O contrato prevê multa rescisória de 20% sobre o crédito parcial de R$ 25.000, em favor da administradora. Qual a multa máxima cobrável?",["R$ 3.000","R$ 5.000","R$ 2.500","R$ 25.000"],"20% × 25.000 = 5.000, mas a multa em favor da administradora não pode passar da taxa de administração restante (art. 32-A, III): R$ 3.000.","Res. BCB 285/2023, art. 32-A, III (cálculo)"],
[2,"Crédito de R$ 200.000; o imóvel custa R$ 170.000. Quanto da sobra, no máximo, pode pagar despesas do bem (ITBI, registro, seguros)?",["R$ 20.000","R$ 30.000","R$ 17.000","R$ 3.000"],"Limite de 10% do crédito: 10% × 200.000 = 20.000. Os outros R$ 10.000 podem quitar prestações ou ser devolvidos (art. 18, §3º).","Res. BCB 285/2023, art. 18, §3º (cálculo)"],
[2,"O preço do bem subiu 4% entre a emissão do boleto e a assembleia. A parcela de fundo comum paga foi R$ 1.000. Qual a diferença a cobrar até a segunda prestação seguinte?",["R$ 40","R$ 4","R$ 400","R$ 1.040"],"4% × 1.000 = 40, cobrados até a segunda prestação seguinte à verificação (art. 25-A).","Res. BCB 285/2023, art. 25-A (cálculo)"],
[2,"Plano de 100 meses (1% do crédito por parcela de fundo comum). O consorciado pagou 20 parcelas e um lance de 30% do crédito. Qual o percentual amortizado?",["50%","30%","20%","60%"],"20 × 1% = 20%, mais 30% do lance = 50%. O lance quita ou amortiza prestações vincendas (art. 12, parágrafo único).","Res. BCB 285/2023, art. 12, parágrafo único (cálculo)"],
[2,"Crédito de R$ 80.000 em 80 meses (fundo comum de R$ 1.000 por mês). Um lance de R$ 20.000 é usado para quitar as últimas prestações. Considerando só o fundo comum, quantas parcelas são quitadas?",["20","25","16","10"],"20.000 ÷ 1.000 = 20 parcelas, na forma prevista no contrato (art. 12, parágrafo único).","Res. BCB 285/2023, art. 12, parágrafo único (cálculo)"],
[2,"Parcela de consórcio de imóvel de R$ 2.000. O FGTS abate 80% da parcela durante 12 meses. Qual o total abatido?",["R$ 19.200","R$ 24.000","R$ 1.600","R$ 9.600"],"80% × 2.000 = 1.600 por mês; × 12 = 19.200. Regra do FGTS para consórcio de imóveis, só depois do uso do crédito (ABAC).","FGTS no consórcio: ABAC (blog e Cartilha FGTS e Consórcio) (cálculo)"],
[2,"A perda de poder aquisitivo do grupo é de R$ 6.000. Rendimentos e multas retidos cobrem R$ 2.000 e o fundo de reserva, R$ 1.000. O restante é rateado entre 100 consorciados ativos. Quanto cada um paga?",["R$ 30","R$ 60","R$ 20","R$ 10"],"6.000 − 2.000 − 1.000 = 3.000; ÷ 100 = 30. Essa é a ordem do art. 25-B, §1º, e o rateio não amortiza o crédito (§4º).","Res. BCB 285/2023, art. 25-B (cálculo)"],
[2,"Consorciado contemplado que ainda não usou o crédito é excluído. O crédito parcial é R$ 40.000, o contrato prevê multa rescisória de 10% sobre ele e há R$ 1.500 de prestações em atraso. Quanto ele recebe?",["R$ 34.500","R$ 36.000","R$ 38.500","R$ 40.000"],"Multa 10% × 40.000 = 4.000; 40.000 − 4.000 − 1.500 = 34.500. As obrigações pendentes e as multas são deduzidas do crédito parcial (art. 33, I).","Res. BCB 285/2023, art. 33, I (cálculo)"],
[2,"Taxa de administração de 0,25% ao mês sobre o crédito, em plano de 72 meses. Qual a taxa total?",["18%","25%","7,2%","1,8%"],"0,25% × 72 = 18% do crédito.","Lei 11.795/2008, art. 27; Res. BCB 285/2023, art. 19 (cálculo)"],
[2,"Crédito de R$ 50.000 à disposição do contemplado por 2 meses, com rendimento líquido de 0,8% ao mês. Em juros simples, qual o valor disponível ao final?",["R$ 50.800","R$ 50.000","R$ 50.400","R$ 58.000"],"0,8% × 2 = 1,6%; 1,6% × 50.000 = 800; total 50.800 (art. 17: rendimentos proporcionais ao período).","Res. BCB 285/2023, art. 17 (cálculo)"],
[3,"O CDC inclui entre os princípios da Política Nacional das Relações de Consumo:",["O fomento de ações de educação financeira dos consumidores","A proibição de vendas a prazo a consumidores endividados","A garantia de lucro mínimo ao fornecedor de crédito","A dispensa de informar preços em ofertas pela internet"],"CDC, art. 4º, IX (Lei 14.181/2021). A educação financeira é referência do Módulo 4 no edital (Portal ENEF).","CDC (Lei 8.078/1990), art. 4º, IX"],
[3,"Desde a Lei 14.181/2021, é direito básico do consumidor:",["A garantia de práticas de crédito responsável, educação financeira e prevenção do superendividamento","Receber crédito sem análise de renda, quando houver garantia real ou fiador idôneo","Desistir de qualquer contrato a qualquer tempo, sem custo ou multa","Ter contemplação garantida no consórcio em até doze meses da adesão"],"CDC, art. 6º, XI.","CDC (Lei 8.078/1990), art. 6º, XI"],
[3,"Na oferta de crédito ou de venda a prazo, o CDC veda:",["Assediar ou pressionar o consumidor, sobretudo idoso, analfabeto ou vulnerável","Informar o custo efetivo total e a taxa de juros do contrato antes da contratação","Entregar ao consumidor cópia do contrato e da proposta assinada","Explicar os riscos e as consequências do não pagamento das parcelas"],"CDC, art. 54-C, IV.","CDC (Lei 8.078/1990), art. 54-C, IV"],
[3,"Segundo o CDC, superendividamento é:",["Não conseguir, de boa-fé, pagar as dívidas de consumo sem comprometer o mínimo existencial","Ter mais de uma cota de consórcio ou mais de um financiamento ativo ao mesmo tempo, mesmo em dia","Atrasar uma prestação por mais de 30 dias, em qualquer contrato de consumo","Comprometer mais de 30% da renda com dívidas, mesmo pagando todas em dia"],"CDC, art. 54-A, §1º: superendividamento é a impossibilidade manifesta de o consumidor pessoa natural, de boa-fé, pagar a totalidade de suas dívidas de consumo, exigíveis e vincendas, sem comprometer seu mínimo existencial.","CDC (Lei 8.078/1990), art. 54-A, §1º"],
[3,"Uma orientação coerente de educação financeira antes de aderir a um consórcio é:",["Comparar a prestação com o orçamento mensal e manter uma reserva para imprevistos","Comprometer toda a renda livre com a parcela, para ser contemplado mais cedo","Contar com um lance futuro para pagar as parcelas que não couberem na renda","Assinar logo, para garantir a vaga, e organizar o orçamento depois da adesão"],"Planejamento e reserva são princípios da educação financeira (Portal Vida e Dinheiro/ENEF, referência do Módulo 4 no edital). Prestação acima da capacidade leva à inadimplência e à exclusão.","Boas práticas e educação financeira (ENEF, citada no edital), sem artigo"],
[3,"Informações negativas sobre o consumidor em cadastros não podem se referir a período superior a:",["Cinco anos","Um ano","Dez anos","Vinte anos"],"CDC, art. 43, §1º.","CDC (Lei 8.078/1990), art. 43, §1º"],
[3,"Na cobrança de prestações em atraso, o consumidor inadimplente:",["Não pode ser exposto a ridículo nem submetido a constrangimento ou ameaça","Pode ser cobrado no local de trabalho, diante dos colegas, se houver atraso","Pode ter o nome divulgado em redes sociais, para estimular o pagamento","Deve ser cobrado por telefone a qualquer hora, inclusive à noite"],"CDC, art. 42, caput.","CDC (Lei 8.078/1990), art. 42"],
[0,"Pela Lei 11.795, consorciado ativo é o que mantém vínculo obrigacional com o grupo. Ficam de fora dessa definição:",["O inadimplente não contemplado e o excluído","O contemplado que já usou o crédito e o excluído","O inadimplente contemplado e o adimplente não contemplado","Quem ofertou lance e não foi contemplado"],"Art. 21: consorciado ativo é o que mantém vínculo obrigacional com o grupo, excetuados o inadimplente não contemplado e o excluído. O contemplado inadimplente continua ativo.","Lei 11.795/2008, art. 21"],
[0,"Pela Lei 11.795, a contemplação só pode ocorrer se houver recursos suficientes no grupo para:",["Adquirir o bem ou serviço e restituir os excluídos","Pagar a taxa de administração de todo o prazo","Cobrir o seguro e o fundo de reserva até o fim do grupo","Contemplar ao menos dois consorciados na assembleia"],"Art. 23: a contemplação está condicionada à existência de recursos suficientes no grupo para a aquisição do bem ou serviço e para a restituição aos excluídos.","Lei 11.795/2008, art. 23"],
[0,"Em regra, segundo a Lei 11.795, o valor do crédito pago ao contemplado corresponde ao valor do bem ou serviço vigente:",["Na data da assembleia de contemplação","Na data da assinatura do contrato de adesão","Na data em que ele escolhe o fornecedor","Na data da primeira assembleia do grupo"],"Art. 24, caput. O crédito ainda recebe rendimentos líquidos entre a disponibilização e o uso (§1º). Se o objeto não puder ser identificado com precisão, valor e atualização ficam no contrato (§2º).","Lei 11.795/2008, art. 24"],
[0,"Pela Lei 11.795, os recursos não procurados, qualquer que seja a origem, devem ter:",["Tratamento contábil específico, separado da contabilidade da administradora","Registro como receita própria da administradora, logo após o encerramento do grupo","Incorporação ao fundo comum do grupo mais novo da administradora","Registro como dívida do Banco Central com os consorciados"],"Art. 38. Os recursos não procurados são geridos pela administradora e aplicados como os dos grupos em andamento (art. 34), mas não se misturam com o patrimônio dela.","Lei 11.795/2008, arts. 34 e 38"],
[0,"Na aquisição de imóvel por meio de consórcio, a Lei 11.795 prevê que:",["Registro e averbação contam como um único ato para taxas, emolumentos e custas","A compra e venda exige escritura pública em cartório, qualquer que seja o valor do imóvel","O imóvel fica isento de ITBI e de qualquer taxa de cartório","O registro só pode ser feito depois da quitação total da cota"],"Art. 45: registro e averbação são considerados ato único para cálculo de taxas, emolumentos e custas. O parágrafo único permite a compra e venda por instrumento particular, por isso a escritura pública não é obrigatória.","Lei 11.795/2008, art. 45"],
[0,"A administradora que se recusa a exibir livros e documentos a funcionários credenciados do Banco Central comete, pela Lei 11.795:",["Embaraço à fiscalização, sujeito às penalidades da lei","Ato legítimo, protegido pelo sigilo das operações dos grupos","Infração condicionada a ordem judicial prévia","Falta leve, punida só com advertência verbal"],"Art. 8º: o Banco Central pode exigir documentos, livros e acesso a sistemas. A recusa configura embaraço à fiscalização.","Lei 11.795/2008, art. 8º"],
[0,"Hoje, as infrações à Lei 11.795 e às normas do Sistema de Consórcios ficam sujeitas a:",["Ação punitiva do Banco Central, nos termos da legislação em vigor","Multas fixadas em valores no próprio art. 42 da Lei 11.795","Sanções aplicadas pela ABAC, como a cassação da certificação dos profissionais","Processo no Procon, com multa paga pelo fundo comum do grupo"],"Art. 42, na redação da Lei 13.506/2017, que revogou os antigos incisos com as penalidades e remeteu à ação punitiva do Banco Central.","Lei 11.795/2008, art. 42 (redação da Lei 13.506/2017)"],
[0,"Pela Res. BCB 285, o relatório que demonstra a viabilidade econômico-financeira do grupo deve:",["Ficar à disposição do Banco Central na sede, por no mínimo cinco anos após o encerramento do grupo","Ficar à disposição do Banco Central por dez anos, contados da data de constituição do grupo","Ser enviado ao Coaf junto com as comunicações de operações suspeitas do grupo","Ser registrado em cartório e enviado ao Banco Central antes da primeira assembleia"],"Art. 4º. O relatório também mostra, se houver antecipação da taxa de administração, que o valor é compatível com as despesas de venda e corretagem. Não confunda com os dez anos de guarda da Circular 3.978 (art. 67).","Res. BCB 285/2023, art. 4º"],
[0,"Pela Circular 3.978, a política de prevenção à lavagem de dinheiro e ao financiamento do terrorismo deve ser aprovada:",["Pelo conselho de administração ou, se não houver, pela diretoria","Pelo diretor responsável por PLD/FT, sem precisar passar pela diretoria","Pelo Coaf, antes de a instituição iniciar suas atividades","Pela assembleia de consorciados de cada grupo administrado"],"Art. 7º: a política é documentada, mantida atualizada e aprovada pelo conselho de administração ou, se inexistente, pela diretoria. Já a avaliação interna de risco é aprovada pelo diretor responsável (art. 12).","Circular BCB 3.978/2020, art. 7º"],
[0,"Pela Circular 3.978, a avaliação interna de risco de lavagem de dinheiro é aprovada:",["Pelo diretor responsável por PLD/FT, com ciência dos comitês e do conselho ou diretoria","Pelo conselho de administração, sem nenhuma participação do diretor responsável por PLD/FT","Pelo Coaf, que define as categorias de risco de cada instituição supervisionada","Pela auditoria externa, que também a revisa obrigatoriamente a cada cinco anos"],"Art. 12, I: aprovação pelo diretor do art. 9º, com encaminhamento para ciência aos comitês de risco e de auditoria (se houver) e ao conselho ou à diretoria. Revisão a cada dois anos ou quando houver mudanças significativas.","Circular BCB 3.978/2020, art. 12"],
[0,"O diretor responsável por PLD/FT, indicado formalmente ao Banco Central:",["Pode acumular outras funções, desde que não haja conflito de interesses","Não pode acumular nenhuma outra função dentro da instituição","Responde diretamente ao Coaf, sem vínculo com a diretoria da instituição","Precisa ser aprovado pelo Coaf antes de assumir a função"],"Art. 9º, §1º da Circular 3.978.","Circular BCB 3.978/2020, art. 9º"],
[0,"Pela Circular 3.978, o relatório de avaliação de efetividade da política de PLD/FT é:",["Anual, com data-base de 31 de dezembro, enviado até 31 de março do ano seguinte","Semestral, com data-base de 30 de junho, enviado até 31 de dezembro do mesmo ano","Anual, com data-base de 31 de dezembro, enviado até 30 de junho do ano seguinte","Feito a cada dois anos, junto com a revisão da avaliação interna de risco"],"Art. 62: relatório anual, data-base 31 de dezembro, encaminhado até 31 de março do ano seguinte ao comitê de auditoria (se houver) e ao conselho ou à diretoria. O dia 30 de junho é o prazo do relatório de acompanhamento do plano de ação (art. 65).","Circular BCB 3.978/2020, art. 62"],
[0,"Pela Circular 3.978, o relatório de acompanhamento do plano de ação que corrige as deficiências apontadas na avaliação de efetividade deve ser enviado até:",["30 de junho do ano seguinte ao da data-base","31 de março do ano seguinte ao da data-base","31 de dezembro do próprio ano da data-base","Dez dias úteis após o fim do ano da data-base"],"Art. 65. Não confunda com o relatório de efetividade, enviado até 31 de março (art. 62), nem com a declaração de não ocorrência ao Coaf, até dez dias úteis após o fim do ano (art. 54).","Circular BCB 3.978/2020, art. 65"],
[0,"Pela Circular 3.978, a identificação de cliente pessoa natural deve conter, no mínimo:",["Nome completo e número de inscrição no CPF","Nome completo, RG e comprovante de renda","O nome e o endereço residencial","CPF e declaração de bens dos últimos cinco anos"],"Art. 16: no mínimo nome completo e CPF (pessoa natural) ou firma ou denominação social e CNPJ (pessoa jurídica). Renda e residência entram na qualificação (art. 18).","Circular BCB 3.978/2020, art. 16"],
[0,"Na qualificação do cliente, a Circular 3.978 exige coletar, entre outras informações:",["Local de residência e capacidade financeira, como renda ou faturamento","Religião, filiação partidária e estado de saúde do cliente e da sua família","Telefone e e-mail, sem nenhum dado financeiro","Declaração de imposto de renda dos últimos dez anos"],"Art. 18, §1º: local de residência (pessoa natural) ou sede (pessoa jurídica) e capacidade financeira, incluindo renda ou faturamento. A qualificação é reavaliada conforme a relação evolui (§4º).","Circular BCB 3.978/2020, art. 18"],
[0,"Pela Circular 3.978, o registro de cada operação deve conter, no mínimo:",["Tipo, valor, data, nome e CPF/CNPJ do titular e do beneficiário e canal utilizado","Valor e data da operação, sem identificar o titular nem o beneficiário dela","As operações acima de R$ 50 mil, com o nome do gerente responsável","Somente as operações em espécie, com a assinatura do cliente em papel"],"Art. 28, §1º da Circular 3.978. O registro vale para todas as operações e serviços, não só as em espécie.","Circular BCB 3.978/2020, art. 28, §1º"],
[0,"Além dos clientes, a Circular 3.978 exige procedimentos de identificação e qualificação de:",["Funcionários, parceiros e prestadores de serviços terceirizados","Clientes pessoas jurídicas com faturamento elevado","Clientes estrangeiros e pessoas expostas politicamente","Os sócios controladores da própria administradora"],"Art. 56 (o chamado “conheça seu funcionário, parceiro e prestador”), com documento aprovado pela diretoria (art. 57) e classificação nas categorias de risco (art. 58).","Circular BCB 3.978/2020, arts. 56 a 58"],
[0,"É exemplo de situação que a Circular 3.978 manda monitorar como possível indício de lavagem de dinheiro:",["Operação incompatível com a capacidade financeira informada pelo cliente","Pagamento em dia de todas as prestações por débito automático em conta","Cliente que pede cópia do contrato e da tabela de taxas antes de assinar","Lance pago com recursos de origem comprovada e compatível com a renda"],"Art. 39, I: entre os exemplos estão operações incompatíveis com a capacidade financeira, movimentações em espécie com indícios de ocultação, beneficiário final não identificável e cadastro impossível de manter atualizado.","Circular BCB 3.978/2020, art. 39, I"],
[0,"Em operações em espécie, a Circular 3.978 usa dois valores de referência. Qual associação está correta?",["Acima de R$ 2.000: registrar nome e CPF do portador; a partir de R$ 50.000: comunicar ao Coaf","Acima de R$ 2.000: comunicar ao Coaf; a partir de R$ 50.000: registrar nome e CPF do portador","Acima de R$ 10.000: comunicar ao Coaf; a partir de R$ 100.000: bloquear a operação","Acima de R$ 5.000: pedir autorização ao Coaf; a partir de R$ 20.000: recusar a operação"],"Art. 33: registrar nome e CPF do portador em operações em espécie de valor individual superior a R$ 2.000. Art. 49, I: comunicar ao Coaf depósito, aporte ou saque em espécie a partir de R$ 50.000.","Circular BCB 3.978/2020, arts. 33 e 49, I"],
[0,"Sobre a guarda de cadastros e registros de operações, qual afirmação está correta?",["A Lei 9.613 fixa mínimo de 5 anos, e a Circular 3.978 exige mínimo de 10 anos","A Lei 9.613 fixa mínimo de 10 anos, e a Circular 3.978 exige mínimo de 5 anos","As duas normas fixam o mesmo prazo mínimo, de 5 anos após o fim do contrato","As duas normas deixam o prazo de guarda a critério de cada instituição"],"Lei 9.613, art. 10, §2º: mínimo de cinco anos, ampliável pela autoridade competente. Circular 3.978, art. 67: mínimo de dez anos. A administradora segue o prazo maior.","Lei 9.613/1998, art. 10, §2º; Circular BCB 3.978/2020, art. 67"],
[0,"Sobre o prazo para comunicar operação suspeita ao Coaf, qual afirmação está correta?",["A Lei 9.613 fala em 24 horas; a Circular 3.978, em até o dia útil seguinte à decisão de comunicar","A Lei 9.613 fala em até o dia útil seguinte à operação; a Circular 3.978, em 24 horas da operação","As duas normas dão 30 dias corridos, contados da data da operação suspeita","As duas normas exigem a comunicação no mesmo dia, antes de concluir a análise"],"Lei 9.613, art. 11, II: 24 horas. Circular 3.978, art. 48, §2º: até o dia útil seguinte ao da decisão de comunicar, decisão que vem depois do monitoramento e da análise (até 45 dias cada).","Lei 9.613/1998, art. 11, II; Circular BCB 3.978/2020, art. 48, §2º"],
[0,"Entre as sanções que a Lei 9.613 prevê para quem descumpre os deveres de identificação, registro e comunicação está:",["Inabilitação temporária, por até dez anos, para cargo de administrador","Cancelamento automático dos contratos de todos os clientes da empresa","Suspensão do CPF dos administradores na Receita Federal por cinco anos","Transferência obrigatória dos grupos para outra administradora"],"Art. 12: advertência, multa, inabilitação temporária por até dez anos para cargo de administrador e cassação ou suspensão da autorização de funcionamento.","Lei 9.613/1998, art. 12"],
[0,"No CDC, o prazo para reclamar de vícios aparentes ou de fácil constatação em produtos ou serviços duráveis é de:",["90 dias, contados da entrega do produto ou do fim do serviço","30 dias, contados da data de assinatura do contrato","7 dias, contados da contratação fora do estabelecimento","180 dias, contados da primeira assembleia do grupo"],"Art. 26, II (30 dias para não duráveis, inciso I). Não confunda com o arrependimento de 7 dias (art. 49) nem com a prescrição de 5 anos para reparação de danos (art. 27).","CDC (Lei 8.078/1990), art. 26"],
[0,"Pelo CDC, a pretensão à reparação de danos causados por fato do produto ou do serviço prescreve em:",["Cinco anos, a partir do conhecimento do dano e de sua autoria","Três anos, a partir da data de assinatura do contrato com o fornecedor","Um ano, a partir da entrega do produto ou do fim do serviço","Dez anos, a partir do pagamento da última parcela"],"Art. 27 do CDC. O prazo de 90 dias é para reclamar de vício aparente em bem durável (art. 26).","CDC (Lei 8.078/1990), art. 27"],
[0,"É direito básico do consumidor, quando a alegação for verossímil ou ele for hipossuficiente:",["A facilitação da defesa, com inversão do ônus da prova a critério do juiz","A devolução em dobro de qualquer valor pago, mesmo sem cobrança indevida","A anulação automática do contrato, a simples pedido do consumidor","A isenção de custas em qualquer processo contra o fornecedor"],"Art. 6º, VIII do CDC.","CDC (Lei 8.078/1990), art. 6º, VIII"],
[0,"Pelo CDC, a abertura de cadastro ou registro de dados pessoais de consumo, quando não solicitada pelo consumidor, deve ser:",["Comunicada por escrito ao consumidor","Autorizada previamente pelo Procon","Mantida em sigilo do próprio consumidor","Feita só depois de decisão judicial"],"Art. 43, §2º do CDC. Informações negativas não podem ficar registradas por mais de cinco anos (§1º).","CDC (Lei 8.078/1990), art. 43, §2º"],
[1,"A Res. BCB 285 traz dois prazos em dias úteis para a assembleia extraordinária. Depois de receber o pedido de 30% dos consorciados, a administradora deve convocá-la em até:",["Cinco dias úteis do pedido","Oito dias úteis do pedido","Três dias úteis do pedido","Trinta dias corridos do pedido"],"Art. 47, §2º: convocar em até cinco dias úteis do pedido. Os oito dias úteis (§3º) são outra coisa: a antecedência de até oito dias úteis com que a convocação é enviada antes da assembleia.","Res. BCB 285/2023, art. 47, §§2º e 3º"],
[1,"Após a última assembleia de contemplação, qual sequência de prazos da Lei 11.795 está correta?",["Comunicação em até 60 dias e encerramento em até 120 dias, com ao menos 30 dias entre os dois","Comunicação em até 30 dias e encerramento em até 60 dias, com ao menos 120 dias entre os dois","Comunicação em até 120 dias e encerramento em até 60 dias, sem intervalo mínimo entre eles","Comunicação em até 60 dias e encerramento em até 180 dias, com ao menos 90 dias entre os dois"],"Art. 31: comunicação em até 60 dias da última assembleia de contemplação. Art. 32: encerramento em até 120 dias dessa assembleia, decorridos ao menos 30 dias da comunicação.","Lei 11.795/2008, arts. 31 e 32"],
[1,"Qual destes prazos de pagamento ao consorciado está correto?",["Crédito à disposição do contemplado: até o 3º dia útil após a homologação da contemplação","Devolução por grupo não constituído em 90 dias: até 30 dias corridos, sem rendimentos","Recursos não procurados: pagamento em até 5 dias úteis do comparecimento do consorciado","Crédito em espécie ao contemplado que não o usou: possível após 90 dias da contemplação"],"Res. BCB 285, art. 16: crédito até o 3º dia útil após a homologação. Os demais estão trocados: grupo não constituído devolve em até 5 dias úteis, com rendimentos (art. 20, §1º); não procurados, em até 30 dias corridos do comparecimento (Lei 11.795, art. 36); crédito em espécie, após 180 dias sem uso (art. 15, §2º).","Res. BCB 285/2023, arts. 15, §2º, 16 e 20, §1º; Lei 11.795/2008, art. 36"],
[1,"Na Res. BCB 285, os números 90 e 180 dias aparecem em regras diferentes. Qual associação está correta?",["90 dias: prazo para o grupo ser constituído; 180 dias: prazo após o qual o contemplado pode receber o crédito em espécie","90 dias: prazo para o contemplado receber o crédito em espécie; 180 dias: prazo máximo para o grupo ser constituído","90 dias: prazo máximo para encerrar o grupo; 180 dias: prazo para usar o FGTS como lance na cota","90 dias: validade do Demonstrativo Individual; 180 dias: prazo máximo para a primeira assembleia"],"Art. 20, §1º: se o grupo não for constituído em 90 dias da assinatura do contrato, os valores são devolvidos. Art. 15, §2º: após 180 dias da contemplação sem uso, o crédito pode ser recebido em espécie, quitadas as obrigações.","Res. BCB 285/2023, arts. 15, §2º e 20, §1º"],
[1,"Em grupo constituído desde 1º/7/2024, o consorciado A (não contemplado) e o consorciado B (contemplado que já usou o crédito) deixam de pagar. Pela Res. BCB 285:",["A pode ser excluído após três vencimentos sem pagar; contra B, a administradora executa as garantias, sem excluí-lo","A e B podem ser excluídos após três vencimentos sem pagar, com devolução do crédito parcial quando forem contemplados","A só pode ser excluído por ordem judicial; B perde o bem e é excluído do grupo no mesmo dia do atraso","Contra A, as garantias são executadas de imediato; B é excluído e recebe o percentual amortizado do bem"],"Art. 32, II e parágrafo único: exclusão após três vencimentos, vedada para quem já usou o crédito. Art. 27: se o contemplado que usou o crédito atrasar mais de uma prestação, a administradora adota de imediato os procedimentos para executar as garantias.","Res. BCB 285/2023, arts. 27 e 32"],
[1,"Qual destes percentuais está associado corretamente à sua regra?",["30%: consorciados que podem pedir a convocação de assembleia extraordinária","50%: limite de cotas de um mesmo consorciado em relação às cotas ativas do grupo","10%: parcela mínima da multa e dos juros de mora que o contrato destina ao grupo","25%: parte do crédito que pode pagar despesas do bem, como tributos e registros"],"Lei 11.795, art. 19: 30% dos consorciados ativos. Os outros estão trocados: o limite de cotas é 10% (Res. BCB 285, art. 9º); ao grupo vão ao menos 50% de multa e juros (Lei, art. 28); despesas do bem até 10% do crédito (Res., art. 18, §3º).","Lei 11.795/2008, arts. 19 e 28; Res. BCB 285/2023, arts. 9º e 18, §3º"],
[1,"Sobre a representação do consorciado ausente nas assembleias, a Lei 11.795 prevê:",["Na ordinária, basta outorga de poderes e previsão no contrato; na extraordinária, procuração com poderes específicos","Na ordinária e na extraordinária, a administradora vota automaticamente pelo ausente, sem precisar de procuração","Na ordinária não cabe representação; na extraordinária, qualquer parente vota sem procuração","Nas duas, o ausente só pode ser representado por advogado, com firma reconhecida em cartório"],"Art. 20, §1º: na AGO, a administradora pode representar o ausente se houver outorga de poderes e previsão contratual. §2º: na AGE, exige-se outorga de poderes específicos (que pode ser à administradora), com dia, hora, local e assuntos.","Lei 11.795/2008, art. 20, §§1º e 2º"],
[1,"Pela Lei 11.795, a restituição ao consorciado excluído não contemplado é calculada:",["Pelo percentual amortizado do bem na data da assembleia de contemplação, com os rendimentos","Pelo valor nominal das parcelas pagas, sem correção monetária nem rendimentos","Pelo percentual amortizado do bem na data da exclusão, sem os rendimentos","Pelo valor das parcelas pagas, corrigido pela taxa Selic até a data da exclusão"],"Art. 30, com os rendimentos do art. 24, §1º. O valor do bem considerado é o da assembleia em que o excluído é contemplado, e não o da data da exclusão.","Lei 11.795/2008, arts. 24, §1º e 30"],
[1,"Sobre o saldo mensal de recursos não procurados, a cobrança de taxa de permanência é:",["Facultativa, se prevista no contrato","Obrigatória, em percentual do BCB","Proibida em qualquer situação","Livre, mesmo sem previsão contratual"],"Art. 35 da Lei 11.795: cobrança facultada, desde que prevista no contrato.","Lei 11.795/2008, art. 35"],
[1,"Quando o crédito é fixado por valor nominal, e não pelo preço de um bem de referência, a Res. BCB 285 manda reajustá-lo:",["Pelo índice ou indicador previsto no contrato, na periodicidade contratual","Quando o preço de mercado de bens parecidos subir ou cair, conforme pesquisa da administradora","Pela taxa Selic, a cada assembleia ordinária do grupo","Por decisão da assembleia extraordinária do grupo"],"Art. 6º, II e §2º. Quando o crédito segue o preço de um bem (inciso I), ele acompanha as altas e baixas desse preço (§1º).","Res. BCB 285/2023, art. 6º, §2º"],
[1,"Quando o crédito é fixado pelo preço de um bem de referência, a Res. BCB 285 prevê que ele seja reajustado:",["Sempre que o preço do bem subir ou cair, conforme o contrato","Por índice de inflação, uma vez por ano","Quando o preço subir, sem redução quando ele cair","Por índice de inflação, na data de aniversário do grupo"],"Art. 6º, I e §1º: o contrato indica a fonte do preço, e o crédito acompanha as variações para mais ou para menos. Quando o crédito é nominal, segue o índice do contrato (§2º).","Res. BCB 285/2023, art. 6º, §1º"],
[1,"No consórcio de imóvel, a Res. BCB 285 permite usar o crédito para adquirir:",["Imóvel construído ou na planta, inclusive terreno com opção de construção ou reforma","Imóvel pronto e quitado, sem possibilidade de terreno ou de construção","Imóvel na planta, vinculado a empreendimento da própria administradora","Qualquer bem, imóvel ou móvel, desde que de valor igual ou menor ao do crédito"],"Art. 15, I, c (e d, para imóvel vinculado a empreendimento imobiliário, se previsto no contrato).","Res. BCB 285/2023, art. 15, I, c"],
[1,"Para quitar financiamento com o crédito do consórcio, a Res. BCB 285 considera financiamento:",["Crédito, arrendamento mercantil financeiro e consórcio cujo crédito já foi usado","Financiamento bancário com alienação fiduciária registrada em cartório","Empréstimo pessoal, cartão de crédito e cheque especial do contemplado","Os financiamentos contratados depois da adesão ao consórcio"],"Art. 15, §1º. A quitação deve ser total e de financiamento do próprio contemplado, da mesma categoria do objeto do contrato (art. 15, II).","Res. BCB 285/2023, art. 15, §1º"],
[1,"Pela Res. BCB 285, o crédito parcial do consorciado excluído é pago:",["Em espécie ou por transferência, descontadas as multas contratuais","Em parcelas mensais até o fim do grupo, sem nenhum rendimento sobre o valor","Em cotas de outro grupo da administradora, sem multas","Integralmente no dia da exclusão, sem descontar as multas"],"Art. 15, III. O pagamento ocorre quando o excluído é contemplado (art. 33), com rendimentos (Lei 11.795, art. 30).","Res. BCB 285/2023, art. 15, III"],
[1,"Pela Res. BCB 285, o saldo devedor da cota compreende:",["Prestações e diferenças negativas não pagas e outras obrigações financeiras do contrato","As prestações já vencidas e não pagas, sem incluir as que ainda vão vencer até o fim do plano","A taxa de administração e o seguro que ainda não foram pagos","O valor do crédito total menos o valor do lance ofertado na contemplação"],"Art. 26 da Res. BCB 285.","Res. BCB 285/2023, art. 26"],
[1,"Na dissolução do grupo aprovada em assembleia extraordinária, os valores pagos pelos contemplados são restituídos aos não contemplados (inclusive excluídos):",["Mensalmente, conforme o caixa, na proporção do percentual amortizado ou do crédito vigente","De uma só vez, no dia da assembleia que aprovou a dissolução, em partes iguais entre todos","Ao final do prazo original do grupo, sem nenhum rendimento","Na ordem que a administradora escolher, sem critério de proporcionalidade"],"Art. 31, II. As contribuições vincendas dos contemplados continuam a ser pagas e reajustadas conforme o contrato (inciso I).","Res. BCB 285/2023, art. 31"],
